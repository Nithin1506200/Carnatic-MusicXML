# before engraving, especially where `notes` flags vakra or anya swaras.
# ---------------------------------------------------------------------------

[[janya]]
name = "Malahari"
janya_of = "Mayamalavagowla"
arohana = "S R1 M1 P D1 S"
avarohana = "S D1 P M1 G3 R1 S"
notes = "Avarohana is vakra; G3 appears only in the descent."
reference = "Repository score 'Sri Gananatha (Lambodara Geetham)'; standard geetham literature (e.g., S. Bhagyalekshmy, 'Ragas in Carnatic Music')"

[[janya]]
name = "Vasantha"
janya_of = "Suryakanta"
arohana = "S M1 G3 M1 D2 N3 S"
avarohana = "S N3 D2 M1 G3 R1 S"
notes = "Vakra in both directions; characteristic of varnam and krithi repertoire."
reference = "Repository score 'Ninnu Kori Yunnara' manuscript transcription; S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Madhyamavathi"
janya_of = "Kharaharapriya"
alternate_names = ["Madhyamavati", "Madhyamavadi"]
arohana = "S R2 M1 P N2 S"
avarohana = "S N2 P M1 R2 S"
reference = "Repository score 'Bhagyada Lakshmi Baaramma' (user-supplied notation); S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Mohanam"
janya_of = "Harikambhoji"
alternate_names = ["Mohana", "Bhoop", "Bhoopali"]
arohana = "S R2 G3 P D2 S"
avarohana = "S D2 P G3 R2 S"
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Hamsadhwani"
janya_of = "Dheerasankarabharanam"
alternate_names = ["Hamsadhvani"]
arohana = "S R2 G3 P N3 S"
avarohana = "S N3 P G3 R2 S"
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"
notes = "Audava raga composed by Ramaswami Dikshitar; omits M1 and D2."

[[janya]]
name = "Bilahari"
janya_of = "Dheerasankarabharanam"
alternate_names = ["Belahari"]
arohana = "S R2 G3 P D2 S"
avarohana = "S N2 D2 P M1 G3 R2 S"
notes = "Avarohana is vakra; M1 appears only in the descent."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Arabhi"
janya_of = "Dheerasankarabharanam"
alternate_names = ["Aarabhi"]
arohana = "S R2 M1 P D2 S"
avarohana = "S N2 D2 P M1 G3 R2 S"
notes = "Vakra; characteristic prayoga S R2 M1 P S D2 S in the ascent. Omits G3 in the plain ascent."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Devagandhari"
janya_of = "Dheerasankarabharanam"
arohana = "S R2 M1 P D2 N2 S"
avarohana = "S N2 P M1 G3 R2 S"
notes = "Vakra gamaka-heavy raga; do not confuse with Abheri (Karnataka Devagandhari)."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Kedaram"
janya_of = "Dheerasankarabharanam"
alternate_names = ["Kedara", "Kedaragowla"]
arohana = "S M1 G3 M1 P D2 S"
avarohana = "S N3 D2 P M1 G3 R2 S"
notes = "Vakra in the ascent (S does not move straight up; R2 appears mainly in descent and prayogas such as P M1 G3 R2 S)."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Begada"
janya_of = "Dheerasankarabharanam"
alternate_names = ["Begaada"]
arohana = "S G3 R2 G3 M1 P D2 N2 P S"
avarohana = "S N3 P M1 G3 R2 S"
notes = "Heavily vakra; D2 and N2/N3 shadja-varjya passages and skipped swaras are characteristic."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Brindavana Saranga"
janya_of = "Dheerasankarabharanam"
alternate_names = ["Brindavansaranga", "Brindavana Saranga (Carnatic)"]
arohana = "S R2 M1 P D2 N3 S"
avarohana = "S N3 P M1 R2 S"
notes = "Omits G3, which distinguishes it from Suddha Saveri; N3 touches S in the ascent."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Suddha Saveri"
janya_of = "Harikambhoji"
alternate_names = ["Karnataka Suddha Saveri", "Durga (Karnataka)"]
arohana = "S R2 M1 P D2 S"
avarohana = "S D2 P M1 R2 S"
notes = "Audava; some texts also list it under Dheerasankarabharanam. Confirm parentage with the score's source."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Sahana"
janya_of = "Harikambhoji"
alternate_names = ["Shaana"]
arohana = "S R2 G3 M1 P M1 D2 N2 S"
avarohana = "S N2 D2 P M1 G3 G3 R2 S"
notes = "Deeply vakra with kampita gamaka on G3 and M1; do not flatten into a straight scale."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Kambhoji"
janya_of = "Harikambhoji"
alternate_names = ["Khambhoji", "Kambodi"]
arohana = "S R2 G3 M1 P D2 S"
avarohana = "S N2 D2 P M1 G3 R2 S"
notes = "N3 occurs as anya swara in characteristic prayogas; treat as note-abhava raga, not a plain scale."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Surutti"
janya_of = "Harikambhoji"
alternate_names = ["Surati"]
arohana = "S R2 M1 P N2 S"
avarohana = "S N2 D2 P M1 G3 R2 S"
notes = "Vakra; G3 appears only in the descent."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Khamas"
janya_of = "Harikambhoji"
alternate_names = ["Kamas", "Khamaas"]
arohana = "S M1 G3 M1 P D2 N2 S"
avarohana = "S N2 D2 P M1 G3 R2 S"
notes = "Vakra in the ascent (S begins directly on M1)."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Kuntalavarali"
janya_of = "Harikambhoji"
arohana = "S M1 P D2 S"
avarohana = "S N2 D2 P M1 S"
notes = "Vakra; R2 and G3 are varjya in the ascent and appear only through N2 D2 in the descent."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Suddha Dhanyasi"
janya_of = "Natabhairavi"
alternate_names = ["Shuddha Dhanyasi"]
arohana = "S G2 M1 P N2 S"
avarohana = "S N2 P M1 G2 S"
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Hindolam"
janya_of = "Natabhairavi"
alternate_names = ["Hindola", "Malkauns"]
arohana = "S G2 M1 D1 N2 S"
avarohana = "S N2 D1 M1 G2 S"
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Abheri"
janya_of = "Natabhairavi"
alternate_names = ["Karnataka Devagandhari", "Bheema Plasika", "Bhimpalas"]
arohana = "S G2 M1 P N2 S"
avarohana = "S N2 D1 P M1 G2 R2 S"
notes = "D1 and R2 appear only in the descent."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Bhairavi"
janya_of = "Natabhairavi"
alternate_names = ["Sindhu Bhairavi (distinct)", "Karnataka Bhairavi"]
arohana = "S G2 R2 G2 M1 P D2 N2 S"
avarohana = "S N2 D1 P M1 G2 R2 S"
notes = "Vakra; characteristic G2 R2 G2 curves. D2 is an anya swara relative to the parent Natabhairavi."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Kapi"
janya_of = "Kharaharapriya"
alternate_names = ["Kaapi"]
arohana = "S R2 G2 M1 P D2 N2 S"
avarohana = "S N2 D2 P M1 G2 R2 S"
notes = "Deshya raga; anya swaras (D3, N3) occur in characteristic prayogas. Record the version used per score."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Abhogi"
janya_of = "Kharaharapriya"
alternate_names = ["Aabhogi"]
arohana = "S R2 M1 D2 N2 S"
avarohana = "S N2 D2 M1 R2 S"
notes = "Vakra; G2 and P are varjya. Audava counterpart of Sriranjani."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Sriranjani"
janya_of = "Kharaharapriya"
alternate_names = ["Shree Ranjani", "Shriranjani"]
arohana = "S R2 G2 M1 D2 N2 S"
avarohana = "S N2 D2 M1 G2 R2 S"
notes = "P is varjya; vakra."
reference = "S. Bhagyalekshmy, 'Ragas in Carnatic Music'"

[[janya]]
name = "Bhupalam"
