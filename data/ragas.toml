# Carnatic raga registry — the single source of truth for raga facts.
#
# Score MDX metadata declares only `raga: <name>`; the arohana, avarohana,
# raga type, janya parentage, and melakarta number are derived from this file
# (see scripts/generate-ragas.ts and docs/score-notation.md).
#
# Rules (per AGENTS.md):
# - Only add a raga after verifying its arohana and avarohana from an
#   authoritative source, and record that source in `reference`.
# - Vakra phrases, anya swaras, and characteristic prayogas belong in `notes`;
#   do not reduce a raga to an oversimplified scale.
# - `alternate_names` carries common spelling variants used for lookup; every
#   name and alias must be unique across the whole file.
#
# Schema:
#   [[melakarta]]  number, name, arohana, avarohana, reference,
#                  alternate_names? (array), notes?
#   [[janya]]      name, janya_of (parent melakarta name), arohana, avarohana,
#                  reference, alternate_names? (array), notes?
#
# The 72 melakartas follow the standard Kanakangi-Rasikapriya scheme; their
# avarohana is always the exact reverse of the arohana (the generator enforces
# this, along with the swaras prescribed by each melakarta number).

